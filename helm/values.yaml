snellServer:
  image:
    registry: ghcr.io
    repository: xudongcc/snell-server
    tag: 5.0.0
    pullPolicy: IfNotPresent
    pullSecrets: []

  resourcesPreset: "micro"
  resources: {}

  host: "::0"
  port: 443
  psk: "psk"

shadowTLS:
  enabled: false
  image:
    registry: ghcr.io
    repository: ghcr.io/ihciah/shadow-tls
    tag: v0.2.25
    pullPolicy: IfNotPresent
    pullSecrets: []

  resourcesPreset: "micro"
  resources: {}

  port: 443
  sni: "gateway.icloud.com:443"
  password: "password"

nodeSelector: {}

tolerations: []

commonLabels: {}

commonAnnotations: {}

podLabels: {}

podAnnotations: {}
