snellServer:
  image:
    registry: ghcr.io
    repository: xudongcc/snell-server
    tag: 6.0.0
    pullPolicy: IfNotPresent
    pullSecrets: []

  resourcesPreset: "micro"
  resources: {}

  # 用于声明容器和 Service 端口。
  port: 7177
  # 必须为 12–255 字节；部署时请替换为随机密钥。
  psk: "please-change-me"
  # 完整监听地址列表；为空时使用 [::1]:<port>，自定义地址端口需与 port 保持一致。
  listen: ""
  mode: "default"
  dns: ""
  # 为空时使用上游默认值。
  dnsIpPreference: ""
  egressInterface: ""

shadowTLS:
  enabled: true
  forceLegacyDriver: true
  image:
    registry: ghcr.io
    repository: ihciah/shadow-tls
    tag: v0.2.25
    pullPolicy: IfNotPresent
    pullSecrets: []

  resourcesPreset: "micro"
  resources: {}

  port: 8443
  listenHost: "::0"
  serverHost: "::1"
  fastOpen: "1"
  sni: "gateway.icloud.com"
  password: "changeme"

hostNetwork: false

dnsPolicy: Default

service:
  enabled: true
  exposeSnellServer: false
  type: ClusterIP
  annotations: {}
  labels: {}
  clusterIP: ""
  internalTrafficPolicy: Local
  externalTrafficPolicy: Cluster
  sessionAffinity: None
  sessionAffinityConfig: {}
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
  extraPorts: []

traefik:
  ingressRouteTCP:
    enabled: true
    name: ""
    annotations: {}
    labels: {}
    entryPoints:
      - websecure
    nativeLB: true
    tls:
      passthrough: true

nodeSelector: {}

tolerations: []

commonLabels: {}

commonAnnotations: {}

podLabels: {}

podAnnotations: {}
